# Plugins disponibles, separados por coma, con el NOMBRE COMPLETO de cada clase.
#
# EL ORDEN ES LA PRIORIDAD: SelectorPlugin elige el PRIMER plugin de esta lista
# cuyo metodo soporta(contexto) devuelva true.
#   - alternativas va primero: solo atiende preguntas de alternativas.
#   - simple va antes que conceptos: atiende las cortas y las abiertas con muy
#     poco texto (que conceptos tambien aceptaria).
#   - conceptos va al final: atiende las abiertas con texto suficiente.
#
# Para anadir un plugin nuevo basta con escribir su clase aqui (sin tocar Main
# ni SelectorPlugin). Un nombre mal escrito o una clase que no cumpla el contrato
# ProcesadorPlugin se ignora con un aviso.
plugins = \
  com.amcm.evaluadordecuestionarios.plugins.ProcesadorAlternativas, \
  com.amcm.evaluadordecuestionarios.plugins.ProcesadorSimple, \
  com.amcm.evaluadordecuestionarios.plugins.ProcesadorConceptos
